<svg width="460" height="360" viewBox="0 0 460 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- floor shadow (stays still) -->
  <ellipse cx="230" cy="335" rx="175" ry="12" fill="#c3e6ff" opacity="0.7"/>

  <!-- everything below bobs gently up and down as one group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3.2s" repeatCount="indefinite"/>

    <!-- desk top + 4 thin legs -->
    <rect x="45" y="248" width="330" height="9" rx="3" fill="#8fd3ff"/>
    <rect x="60" y="257" width="6" height="60" fill="#a9ddff"/>
    <rect x="130" y="257" width="6" height="60" fill="#a9ddff"/>
    <rect x="290" y="257" width="6" height="60" fill="#a9ddff"/>
    <rect x="358" y="257" width="6" height="60" fill="#a9ddff"/>

    <!-- paper stack, back-left -->
    <g>
      <rect x="60" y="205" width="52" height="6" rx="2" fill="#7fc4ea"/>
      <rect x="64" y="196" width="52" height="6" rx="2" fill="#8fd3ff"/>
      <rect x="59" y="187" width="52" height="6" rx="2" fill="#a9ddff"/>
      <rect x="66" y="178" width="42" height="6" rx="2" fill="#c3e6ff"/>
    </g>

    <!-- monitor 1 (left) -->
    <rect x="118" y="168" width="92" height="63" rx="6" fill="#0b5f6e"/>
    <rect x="125" y="175" width="78" height="48" rx="3" fill="#00b4c9">
      <animate attributeName="opacity" values="1;0.75;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="131" y="182" width="40" height="4" rx="2" fill="#e8feff"/>
    <rect x="131" y="191" width="55" height="4" rx="2" fill="#e8feff" opacity="0.8"/>
    <rect x="131" y="200" width="30" height="4" rx="2" fill="#e8feff" opacity="0.7"/>
    <rect x="131" y="209" width="45" height="4" rx="2" fill="#e8feff" opacity="0.6"/>
    <rect x="155" y="231" width="20" height="9" fill="#8fd3ff"/>
    <rect x="145" y="240" width="40" height="6" rx="2" fill="#7fc4ea"/>

    <!-- monitor 2 (right) -->
    <rect x="222" y="168" width="92" height="63" rx="6" fill="#004a55"/>
    <rect x="229" y="175" width="78" height="48" rx="3" fill="#00b4c9">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="235" y="182" width="45" height="4" rx="2" fill="#e8feff"/>
    <rect x="235" y="191" width="60" height="4" rx="2" fill="#e8feff" opacity="0.8"/>
    <rect x="235" y="200" width="35" height="4" rx="2" fill="#e8feff" opacity="0.7"/>
    <!-- blinking cursor -->
    <rect x="235" y="209" width="4" height="8" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="259" y="231" width="20" height="9" fill="#8fd3ff"/>
    <rect x="249" y="240" width="40" height="6" rx="2" fill="#7fc4ea"/>

    <!-- chair (behind person, between the two monitors) -->
    <ellipse cx="266" cy="345" rx="26" ry="6" fill="#0b5f6e" opacity="0.35"/>
    <rect x="260" y="255" width="9" height="88" rx="4" fill="#0b5f6e"/>
    <rect x="224" y="205" width="60" height="70" rx="14" fill="#0b5f6e"/>

    <!-- person, sitting centered in front of the chair -->
    <circle cx="254" cy="196" r="15" fill="#f0c6a3"/>
    <path d="M 240 199 Q 240 181 254 178 Q 268 181 268 199 Z" fill="#1c2b3a"/>
    <path d="M 230 262 Q 232 219 254 216 Q 276 219 278 262 Z" fill="#00b4c9"/>
    <rect x="236" y="256" width="12" height="38" rx="6" fill="#1c2b3a"/>
    <rect x="266" y="256" width="12" height="38" rx="6" fill="#1c2b3a"/>
    <rect x="222" y="222" width="13" height="34" rx="6" fill="#00b4c9"/>
    <rect x="273" y="222" width="13" height="34" rx="6" fill="#00b4c9"/>

    <!-- speech bubble with gear icon -->
    <g filter="url(#softGlow)">
      <rect x="288" y="120" width="72" height="42" rx="12" fill="#00b4c9" opacity="0.95"/>
      <path d="M 306 162 L 317 162 L 308 175 Z" fill="#00b4c9" opacity="0.95"/>
      <g transform="translate(324,141)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite" additive="sum"/>
        <circle r="12" fill="none" stroke="#ffffff" stroke-width="3.8"/>
        <circle r="4" fill="#ffffff"/>
        <g stroke="#ffffff" stroke-width="3.8">
          <line x1="0" y1="-15" x2="0" y2="-9"/>
          <line x1="0" y1="15" x2="0" y2="9"/>
          <line x1="-15" y1="0" x2="-9" y2="0"/>
          <line x1="15" y1="0" x2="9" y2="0"/>
        </g>
      </g>
    </g>

    <!-- round wastebin with lattice pattern -->
    <g stroke="#8fd3ff" stroke-width="2.6" fill="none">
      <path d="M 380 275 Q 380 315 400 315 Q 420 315 420 275 Z"/>
      <ellipse cx="400" cy="275" rx="20" ry="6"/>
      <line x1="386" y1="280" x2="386" y2="308"/>
      <line x1="400" y1="282" x2="400" y2="311"/>
      <line x1="414" y1="280" x2="414" y2="308"/>
    </g>
  </g>
</svg>
