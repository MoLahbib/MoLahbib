<svg width="420" height="360" viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- floor shadow (stays still while everything else bobs) -->
  <ellipse cx="210" cy="330" rx="150" ry="12" fill="#c3e6ff" opacity="0.7"/>

  <!-- everything below bobs gently up and down as one group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3.2s" repeatCount="indefinite"/>

    <!-- desk -->
    <rect x="55" y="230" width="270" height="9" rx="3" fill="#8fd3ff"/>
    <rect x="68" y="239" width="8" height="65" fill="#a9ddff"/>
    <rect x="298" y="239" width="8" height="65" fill="#a9ddff"/>

    <!-- paper stack on the desk -->
    <g>
      <rect x="80" y="185" width="55" height="6" rx="2" fill="#7fc4ea"/>
      <rect x="83" y="176" width="55" height="6" rx="2" fill="#8fd3ff"/>
      <rect x="80" y="167" width="55" height="6" rx="2" fill="#a9ddff"/>
      <rect x="85" y="158" width="45" height="6" rx="2" fill="#c3e6ff"/>
    </g>

    <!-- monitor 1 (left) -->
    <rect x="115" y="175" width="88" height="60" rx="4" fill="#0b5f6e"/>
    <rect x="121" y="181" width="76" height="46" rx="2" fill="#00b4c9">
      <animate attributeName="opacity" values="1;0.75;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="127" y="188" width="40" height="4" rx="2" fill="#e8feff"/>
    <rect x="127" y="197" width="55" height="4" rx="2" fill="#e8feff" opacity="0.8"/>
    <rect x="127" y="206" width="30" height="4" rx="2" fill="#e8feff" opacity="0.7"/>
    <rect x="150" y="235" width="18" height="8" fill="#8fd3ff"/>

    <!-- monitor 2 (right) -->
    <rect x="210" y="175" width="88" height="60" rx="4" fill="#004a55"/>
    <rect x="216" y="181" width="76" height="46" rx="2" fill="#00b4c9">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="222" y="188" width="45" height="4" rx="2" fill="#e8feff"/>
    <rect x="222" y="197" width="60" height="4" rx="2" fill="#e8feff" opacity="0.8"/>
    <!-- blinking cursor -->
    <rect x="222" y="206" width="4" height="8" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="245" y="235" width="18" height="8" fill="#8fd3ff"/>

    <!-- keyboard -->
    <rect x="150" y="239" width="115" height="7" rx="2" fill="#7fc4ea"/>

    <!-- chair -->
    <ellipse cx="270" cy="315" rx="24" ry="6" fill="#0b5f6e"/>
    <rect x="264" y="235" width="9" height="78" rx="4" fill="#0b5f6e"/>
    <rect x="232" y="228" width="52" height="13" rx="6" fill="#0b5f6e"/>

    <!-- person -->
    <circle cx="266" cy="210" r="13" fill="#f0c6a3"/>
    <path d="M 254 213 Q 254 197 266 195 Q 278 197 278 213 Z" fill="#1c2b3a"/>
    <path d="M 244 262 Q 246 227 266 224 Q 286 227 288 262 Z" fill="#00b4c9"/>
    <rect x="249" y="258" width="11" height="32" rx="5" fill="#1c2b3a"/>
    <rect x="276" y="258" width="11" height="32" rx="5" fill="#1c2b3a"/>
    <rect x="242" y="230" width="12" height="30" rx="6" fill="#00b4c9"/>
    <rect x="280" y="230" width="12" height="30" rx="6" fill="#00b4c9"/>

    <!-- floating gear + idea bubble -->
    <g filter="url(#softGlow)">
      <rect x="245" y="128" width="66" height="40" rx="10" fill="#00b4c9" opacity="0.92"/>
      <path d="M 262 168 L 272 168 L 264 180 Z" fill="#00b4c9" opacity="0.92"/>
      <g transform="translate(292,148)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite" additive="sum"/>
        <circle r="11" fill="none" stroke="#ffffff" stroke-width="3.5"/>
        <circle r="3.5" fill="#ffffff"/>
        <g stroke="#ffffff" stroke-width="3.5">
          <line x1="0" y1="-14" x2="0" y2="-9"/>
          <line x1="0" y1="14" x2="0" y2="9"/>
          <line x1="-14" y1="0" x2="-9" y2="0"/>
          <line x1="14" y1="0" x2="9" y2="0"/>
        </g>
      </g>
    </g>

    <!-- waste bin -->
    <path d="M 335 255 L 341 295 L 369 295 L 375 255 Z" fill="none" stroke="#8fd3ff" stroke-width="3"/>
    <line x1="330" y1="253" x2="380" y2="253" stroke="#8fd3ff" stroke-width="3"/>
  </g>
</svg>
