<svg width="900" height="10" viewBox="0 0 900 10" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4c9"/>
      <stop offset="100%" stop-color="#9df6ff"/>
    </linearGradient>
  </defs>

  <!-- faint full-width base line, always present -->
  <line x1="0" y1="5" x2="900" y2="5" stroke="#9fd3e6" stroke-width="1.5" opacity="0.45" stroke-linecap="round"/>

  <!-- bright bar that grows out from the left edge, then shrinks back, on a loop -->
  <line x1="0" y1="5" x2="0" y2="5" stroke="url(#barGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="x2" values="0;900;0" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite"/>
  </line>
</svg>
