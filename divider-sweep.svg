<svg width="1200" height="20" viewBox="0 0 1200 20" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="growGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#004a55"/>
      <stop offset="100%" stop-color="#7ee9ff"/>
    </linearGradient>
  </defs>

  <!-- faint full-width base track, always present -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="#7fb8cf" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

  <!-- bar that grows left-to-right from the very edge, getting brighter towards its leading tip -->
  <line x1="0" y1="10" x2="0" y2="10" stroke="url(#growGrad)" stroke-width="8" stroke-linecap="round">
    <animate attributeName="x2" values="0;1200" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
