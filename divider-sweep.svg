<svg width="900" height="16" viewBox="0 0 900 16" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <filter id="dotHalo" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <radialGradient id="dotCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#bff6ff"/>
      <stop offset="100%" stop-color="#00b4c9"/>
    </radialGradient>

    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0%"  stop-color="#00b4c9" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00b4c9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9df6ff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#00b4c9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00b4c9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="0 0" to="1200 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>

    <path id="travelPath" d="M 0 8 H 900"/>
  </defs>

  <!-- faint base line, always present -->
  <line x1="0" y1="8" x2="900" y2="8" stroke="#9fd3e6" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

  <!-- bright turquoise highlight sweeping across it -->
  <line x1="0" y1="8" x2="900" y2="8" stroke="url(#sweep)" stroke-width="2.4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- glowing dot travelling along the line -->
  <circle r="7" fill="#00b4c9" opacity="0.5" filter="url(#dotHalo)">
    <animateMotion dur="2.6s" repeatCount="indefinite">
      <mpath href="#travelPath"/>
    </animateMotion>
  </circle>
  <circle r="3.2" fill="url(#dotCore)">
    <animateMotion dur="2.6s" repeatCount="indefinite">
      <mpath href="#travelPath"/>
    </animateMotion>
  </circle>
</svg>
