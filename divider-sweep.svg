<svg width="900" height="18" viewBox="0 0 900 18" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- faint full-width base track, always present, higher contrast -->
  <line x1="0" y1="9" x2="900" y2="9" stroke="#7fb8cf" stroke-width="3" opacity="0.6" stroke-linecap="round"/>

  <!-- solid, dark, high-contrast bar that grows out from the left edge, then shrinks back -->
  <line x1="0" y1="9" x2="0" y2="9" stroke="#00707f" stroke-width="6" stroke-linecap="round">
    <animate attributeName="x2" values="0;900" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
