<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f0ff"/>
      <stop offset="100%" stop-color="#c3e6ff"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- light-blue card background instead of plain white -->
  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="1192" height="292" rx="14" fill="none" stroke="#8fd3ff" stroke-width="2" opacity="0.8"/>

  <!-- circuit lines: darker teal so they read clearly on the light background -->
  <g fill="none" stroke="#0e8fa8" stroke-width="2" opacity="0.55" filter="url(#lineGlow)">
    <path id="line1" d="M 20 45 H 160 L 195 80 H 340"/>
    <path id="line2" d="M 20 90 H 90 L 120 120 H 230"/>
    <path id="line3" d="M 1180 55 H 1010 L 975 90 H 830"/>
    <path id="line4" d="M 1180 100 H 1090 L 1060 130 H 950"/>
    <path id="line5" d="M 20 250 H 170 L 200 220 H 350"/>
    <path id="line6" d="M 20 205 H 100 L 130 175 H 250"/>
    <path id="line7" d="M 1180 245 H 1020 L 990 215 H 840"/>
    <path id="line8" d="M 1180 200 H 1100 L 1075 170 H 960"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#0e8fa8" opacity="0.85">
    <circle cx="195" cy="80" r="3.5"/>
    <circle cx="120" cy="120" r="3.5"/>
    <circle cx="975" cy="90" r="3.5"/>
    <circle cx="1060" cy="130" r="3.5"/>
    <circle cx="200" cy="220" r="3.5"/>
    <circle cx="130" cy="175" r="3.5"/>
    <circle cx="990" cy="215" r="3.5"/>
    <circle cx="1075" cy="170" r="3.5"/>
  </g>

  <!-- animated moving dots travelling along the circuit lines -->
  <g fill="#00d4e6">
    <circle r="4.5"><animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#line1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto"><mpath href="#line2"/></animateMotion></circle>
    <circle r="4.5"><animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto"><mpath href="#line3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto"><mpath href="#line4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#line5"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.8s" repeatCount="indefinite" rotate="auto"><mpath href="#line6"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="4.3s" repeatCount="indefinite" rotate="auto"><mpath href="#line7"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.9s" repeatCount="indefinite" rotate="auto"><mpath href="#line8"/></animateMotion></circle>
  </g>

  <!-- name: solid turquoise, same family of color as the "Werkstudent..." heading style, thin soft glow only (no white fill/halo) -->
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" fill="#00b4c9" letter-spacing="2"
        filter="url(#softGlow)" opacity="0.5">
    MOHAMED LAHBIB
  </text>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" fill="#009cb0" letter-spacing="2">
    MOHAMED LAHBIB
  </text>

  <!-- subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="600" fill="#0b5f6e" letter-spacing="2">
    Software and Data Engineer
  </text>
</svg>
