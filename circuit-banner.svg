<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f0ff"/>
      <stop offset="100%" stop-color="#c3e6ff"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <filter id="dotHalo" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <radialGradient id="dotCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#bff6ff"/>
      <stop offset="100%" stop-color="#00d4e6"/>
    </radialGradient>

    <linearGradient id="nameShimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%"  stop-color="#007c8c"/>
      <stop offset="40%" stop-color="#009cb0"/>
      <stop offset="50%" stop-color="#8ff3ff"/>
      <stop offset="60%" stop-color="#009cb0"/>
      <stop offset="100%" stop-color="#007c8c"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1200 0" to="1200 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

  </defs>

  <rect x="0" y="0" width="1200" height="300" rx="18" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="1192" height="292" rx="14" fill="none" stroke="#8fd3ff" stroke-width="2" opacity="0.8"/>

  <!-- dense crisscrossing circuit-board grid (visible everywhere, including behind the name) -->
  <g>
    <g fill="none" stroke="#2f6fbf" stroke-width="1.6" opacity="0.8">
      <path id="g1" d="M 0 15 H 90 V 55 H 210 V 15 H 300"/>
      <path id="g2" d="M 0 45 H 40 V 100 H 160 V 60 H 260"/>
      <path d="M 0 95 H 130"/>
      <path id="g3" d="M 0 130 H 70 V 170 H 190"/>
      <path id="g4" d="M 0 165 H 30 V 210 H 140 V 250 H 300"/>
      <path d="M 0 220 H 60"/>
      <path id="g5" d="M 0 260 H 110 V 220 H 220"/>
      <path d="M 20 0 V 15"/><path d="M 90 0 V 15"/><path d="M 160 0 V 60"/>
      <path d="M 210 15 V 55"/><path d="M 40 45 V 100"/>
      <path d="M 70 130 V 170"/><path d="M 30 165 V 210"/>
      <path d="M 140 210 V 300"/><path d="M 110 260 V 300"/>
      <path d="M 220 220 V 300"/><path id="g6" d="M 260 60 V 130 H 400"/>
      <path id="g7" d="M 300 15 V 90 H 400"/><path d="M 300 250 V 300"/>
      <path id="g8" d="M 190 170 V 130 H 330 V 90 H 460"/>
      <path d="M 330 130 V 300"/><path id="g9" d="M 400 130 V 40 H 510"/>
      <path d="M 400 90 V 40"/><path d="M 460 90 V 40"/>
      <path d="M 510 40 V 0"/><path id="g10" d="M 510 40 H 610 V 100 H 750"/>
      <path id="g11" d="M 610 100 V 230 H 730"/><path d="M 730 230 V 300"/>
      <path id="g12" d="M 750 100 V 40 H 870"/><path d="M 870 40 V 0"/>
      <path id="g13" d="M 870 40 H 950 V 130 H 1060"/>
      <path id="g14" d="M 950 130 V 230 H 1050"/><path d="M 1050 230 V 300"/>
      <path id="g15" d="M 1060 130 V 60 H 1200"/><path d="M 1060 130 V 200 H 1200"/>
      <path d="M 1140 0 V 60"/><path id="g16" d="M 1200 90 H 1130 V 180 H 1200"/>
      <path id="g17" d="M 1200 240 H 1090 V 280 H 1200"/><path d="M 1000 300 V 250 H 1200"/>
      <path d="M 610 300 V 260 H 690"/><path d="M 200 0 V 60 H 260"/>
      <path id="g18" d="M 640 0 V 30 H 700 V 70"/><path d="M 900 260 V 300"/>
      <path id="g19" d="M 1180 30 H 1100 V 60"/>
      <path id="g20" d="M 250 170 V 250 H 330"/>
      <path id="g21" d="M 330 200 H 460 V 260 H 610"/>
      <path d="M 400 130 V 200"/>
      <path id="g22" d="M 460 90 V 200 H 550 V 300"/>
      <path d="M 550 200 V 260 H 610"/>
    </g>
    <g fill="#1f4f94" opacity="0.85">
      <circle cx="90" cy="55" r="2.6"/><circle cx="210" cy="55" r="2.6"/>
      <circle cx="160" cy="60" r="2.6"/><circle cx="70" cy="170" r="2.6"/>
      <circle cx="30" cy="210" r="2.6"/><circle cx="140" cy="210" r="2.6"/>
      <circle cx="110" cy="260" r="2.6"/><circle cx="220" cy="220" r="2.6"/>
      <circle cx="260" cy="130" r="2.6"/><circle cx="300" cy="90" r="2.6"/>
      <circle cx="190" cy="130" r="2.6"/><circle cx="330" cy="130" r="2.6"/>
      <circle cx="330" cy="90" r="2.6"/><circle cx="460" cy="90" r="2.6"/>
      <circle cx="400" cy="40" r="2.6"/><circle cx="610" cy="100" r="2.6"/>
      <circle cx="730" cy="230" r="2.6"/><circle cx="750" cy="40" r="2.6"/>
      <circle cx="950" cy="130" r="2.6"/><circle cx="1050" cy="230" r="2.6"/>
      <circle cx="1060" cy="130" r="2.6"/><circle cx="1140" cy="90" r="2.6"/>
      <circle cx="1090" cy="240" r="2.6"/><circle cx="700" cy="30" r="2.6"/>
      <circle cx="1100" cy="30" r="2.6"/>
      <circle cx="330" cy="200" r="2.6"/><circle cx="460" cy="200" r="2.6"/>
      <circle cx="550" cy="200" r="2.6"/><circle cx="400" cy="200" r="2.6"/>
      <circle cx="610" cy="260" r="2.6"/>
    </g>
  </g>

  <!-- glowing comet dots travelling directly along the grid lines themselves (no separate bold lines) -->
  <g>
    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#g1"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="5s" repeatCount="indefinite" rotate="auto"><mpath href="#g1"/></animateMotion></circle>

    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto"><mpath href="#g4"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="4.4s" repeatCount="indefinite" rotate="auto"><mpath href="#g4"/></animateMotion></circle>

    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto"><mpath href="#g8"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto"><mpath href="#g8"/></animateMotion></circle>

    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto"><mpath href="#g10"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto"><mpath href="#g10"/></animateMotion></circle>

    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="5.2s" repeatCount="indefinite" rotate="auto"><mpath href="#g11"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="5.2s" repeatCount="indefinite" rotate="auto"><mpath href="#g11"/></animateMotion></circle>

    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto"><mpath href="#g13"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto"><mpath href="#g13"/></animateMotion></circle>

    <circle r="8" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#g15"/></animateMotion></circle>
    <circle r="3.6" fill="url(#dotCore)"><animateMotion dur="4s" repeatCount="indefinite" rotate="auto"><mpath href="#g15"/></animateMotion></circle>

    <circle r="7" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto"><mpath href="#g17"/></animateMotion></circle>
    <circle r="3.2" fill="url(#dotCore)"><animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto"><mpath href="#g17"/></animateMotion></circle>

    <circle r="7.5" fill="#00d4e6" opacity="0.55" filter="url(#dotHalo)"><animateMotion dur="4.1s" repeatCount="indefinite" rotate="auto"><mpath href="#g21"/></animateMotion></circle>
    <circle r="3.4" fill="url(#dotCore)"><animateMotion dur="4.1s" repeatCount="indefinite" rotate="auto"><mpath href="#g21"/></animateMotion></circle>
  </g>

  <!-- name -->
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" fill="#00b4c9" letter-spacing="2" filter="url(#softGlow)">
    MOHAMED LAHBIB
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="2.5s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" fill="url(#nameShimmer)" letter-spacing="2">
    MOHAMED LAHBIB
  </text>

  <!-- subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="600" fill="#0b5f6e" letter-spacing="2">
    Software and Data Engineer
  </text>
</svg>
