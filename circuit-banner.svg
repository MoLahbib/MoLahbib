<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Neon glow filter for the text -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7CFBFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- transparent background, no fill rect -->

  <!-- circuit lines -->
  <g fill="none" stroke="#3ad6e0" stroke-width="1.5" opacity="0.55">
    <path id="line1" d="M 0 40 H 180 L 210 70 H 400"/>
    <path id="line2" d="M 1000 60 H 820 L 790 90 H 620"/>
    <path id="line3" d="M 0 220 H 150 L 180 190 H 360"/>
    <path id="line4" d="M 1000 200 H 850 L 820 230 H 660"/>
    <path id="line5" d="M 60 0 V 30"/>
    <path id="line6" d="M 940 0 V 30"/>
    <path id="line7" d="M 60 260 V 230"/>
    <path id="line8" d="M 940 260 V 230"/>
  </g>

  <!-- small circuit nodes -->
  <g fill="#3ad6e0" opacity="0.7">
    <circle cx="210" cy="70" r="3"/>
    <circle cx="790" cy="90" r="3"/>
    <circle cx="180" cy="190" r="3"/>
    <circle cx="820" cy="230" r="3"/>
  </g>

  <!-- animated moving dots travelling along the circuit lines -->
  <g fill="#a6fff5">
    <circle r="4">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line1"/>
      </animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line2"/>
      </animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="3.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line3"/>
      </animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line4"/>
      </animateMotion>
    </circle>
  </g>

  <!-- glowing name -->
  <text x="500" y="130" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="56" font-weight="800" fill="url(#textGrad)" filter="url(#neonGlow)"
        letter-spacing="4">
    MOHAMED LAHBIB
  </text>

  <!-- subtitle -->
  <text x="500" y="168" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="20" font-weight="500" fill="#c9f7ff" filter="url(#neonGlow)"
        letter-spacing="2">
    Software and Data Engineer
  </text>
</svg>
