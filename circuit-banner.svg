<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- soft glow only (kept subtle so letters stay sharp) -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- transparent background -->

  <!-- circuit lines: brighter, more of them, purple/magenta so they stand apart from the cyan text -->
  <g fill="none" stroke="#c04dff" stroke-width="2" opacity="0.75" filter="url(#lineGlow)">
    <path id="line1" d="M 0 45 H 160 L 195 80 H 340"/>
    <path id="line2" d="M 0 90 H 90 L 120 120 H 230"/>
    <path id="line3" d="M 1200 55 H 1010 L 975 90 H 830"/>
    <path id="line4" d="M 1200 100 H 1090 L 1060 130 H 950"/>
    <path id="line5" d="M 0 250 H 170 L 200 220 H 350"/>
    <path id="line6" d="M 0 205 H 100 L 130 175 H 250"/>
    <path id="line7" d="M 1200 245 H 1020 L 990 215 H 840"/>
    <path id="line8" d="M 1200 200 H 1100 L 1075 170 H 960"/>
    <path d="M 80 0 V 35"/>
    <path d="M 1120 0 V 35"/>
    <path d="M 80 300 V 265"/>
    <path d="M 1120 300 V 265"/>
  </g>

  <!-- circuit nodes -->
  <g fill="#e6a9ff" opacity="0.9">
    <circle cx="195" cy="80" r="3.5"/>
    <circle cx="120" cy="120" r="3.5"/>
    <circle cx="975" cy="90" r="3.5"/>
    <circle cx="1060" cy="130" r="3.5"/>
    <circle cx="200" cy="220" r="3.5"/>
    <circle cx="130" cy="175" r="3.5"/>
    <circle cx="990" cy="215" r="3.5"/>
    <circle cx="1075" cy="170" r="3.5"/>
  </g>

  <!-- animated moving dots travelling along the circuit lines -->
  <g fill="#ffffff">
    <circle r="4.5">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line1"/>
      </animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line2"/>
      </animateMotion>
    </circle>
    <circle r="4.5">
      <animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line3"/>
      </animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="3.6s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line4"/>
      </animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line5"/>
      </animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="3.8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line6"/>
      </animateMotion>
    </circle>
    <circle r="4">
      <animateMotion dur="4.3s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line7"/>
      </animateMotion>
    </circle>
    <circle r="3.5">
      <animateMotion dur="3.9s" repeatCount="indefinite" rotate="auto">
        <mpath href="#line8"/>
      </animateMotion>
    </circle>
  </g>

  <!-- glow layer behind the name (blurred duplicate, keeps the crisp copy readable) -->
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" fill="#4ce8ff" letter-spacing="2"
        filter="url(#softGlow)" opacity="0.9">
    MOHAMED LAHBIB
  </text>

  <!-- crisp solid name on top -->
  <text x="600" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="58" font-weight="800" fill="#ffffff" letter-spacing="2">
    MOHAMED LAHBIB
  </text>

  <!-- subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="600" fill="#8fe9ff" letter-spacing="2"
        filter="url(#softGlow)">
    Software and Data Engineer
  </text>
</svg>
